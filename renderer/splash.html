<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V Music</title>
<style>
  /* ====== Animation de lancement — ~900 ms, puis le logo reste affiché jusqu'à ce que l'appli soit prête ====== */
  :root{
    --splash-total: 900ms;      /* durée totale (pop + bulles + sortie) */
    --splash-bg-1: #0b2a4a;     /* fond : bleu profond */
    --splash-bg-2: #06182c;
    --splash-size: 200px;
  }
  html,body{height:100%;margin:0;background:transparent;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

  #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;border-radius:28px;overflow:hidden;
    background:radial-gradient(circle at 50% 45%, #14507f 0%, var(--splash-bg-1) 45%, var(--splash-bg-2) 100%);}
  .stage{position:relative;width:var(--splash-size);height:var(--splash-size)}

  /* Logo : pop avec rebond + petit coup de nageoire */
  .logo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:26%;
    box-shadow:0 12px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08) inset;
    transform-origin:50% 60%;
    animation:logo-in 520ms cubic-bezier(.2,1.5,.35,1) both;}

  /* Onde type sonar / ride d'eau */
  .ring{position:absolute;inset:0;border-radius:26%;border:3px solid rgba(160,225,255,.75);
    opacity:0;animation:ring 560ms cubic-bezier(.15,.7,.3,1) 140ms both}
  .ring.r2{animation-delay:260ms;border-width:2px}

  /* Bulles qui montent */
  .bubble{position:absolute;bottom:18%;left:50%;width:var(--d);height:var(--d);border-radius:50%;
    border:2px solid rgba(215,242,255,.9);
    background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.85) 0 18%, rgba(190,232,255,.18) 22% 100%);
    opacity:0;animation:bubble var(--t,520ms) cubic-bezier(.2,.6,.3,1) var(--delay) both}

  @keyframes logo-in{
    0%  {opacity:0;transform:scale(.55) rotate(-14deg) translateY(18%)}
    45% {opacity:1}
    100%{opacity:1;transform:scale(1) rotate(0) translateY(0)}
  }
  @keyframes ring{
    0%  {opacity:.9;transform:scale(1)}
    100%{opacity:0;transform:scale(1.75)}
  }
  @keyframes bubble{
    0%  {opacity:0;transform:translate(var(--x0),0) scale(.3)}
    25% {opacity:1}
    100%{opacity:0;transform:translate(var(--x1),var(--y)) scale(1)}
  }
  @keyframes splash-out{
    to{opacity:0;transform:scale(1.08);visibility:hidden}
  }

  /* Accessibilité : pas de mouvement, simple fondu */
  @media (prefers-reduced-motion:reduce){
    .logo{animation:fade 200ms both}
    .ring,.bubble{display:none}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  }

</style>
</head>
