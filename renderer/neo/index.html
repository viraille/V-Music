<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>V Music</title>
<link rel="stylesheet" href="neo.css" />
</head>
<body>
<div id="app">
  <nav id="rail">
    <div class="logo">V</div>
    <button class="nav active" data-view="home" title="Accueil"><svg viewBox="0 0 24 24"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg><span>Accueil</span></button>
    <button class="nav" data-view="search" title="Recherche"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Recherche</span></button>
    <button class="nav" data-view="library" title="Bibliothèque"><svg viewBox="0 0 24 24"><path d="M4 6h2v14H4zm4-2h2v16H8zm4.5 1.5 1.9-.5 4.1 14.5-1.9.5z"/></svg><span>Biblio</span></button>
    <div class="grow"></div>
    <button class="nav" id="btn-settings" title="Paramètres"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg><span>Réglages</span></button>
  </nav>

  <main id="main">
    <header id="topbar">
      <button id="back" class="icon" title="Retour" hidden><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.400-1.400L7.800 13H20z"/></svg></button>
      <div id="searchbox">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="q" type="search" placeholder="Rechercher un titre, un artiste, un album…" autocomplete="off" />
      </div>
      <button id="login" class="chip" hidden>Se connecter</button>
    </header>
    <section id="view"></section>
  </main>

  <footer id="player" class="empty">
    <div class="p-track" id="p-open">
      <div class="p-art"><img id="p-img" alt="" /></div>
      <div class="p-meta"><div id="p-title">Rien en lecture</div><div id="p-artist"></div></div>
    </div>
    <div class="p-center">
      <div class="controls">
        <button class="icon" id="c-prev" title="Précédent"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.500 6V6z"/></svg></button>
        <button class="icon big" id="c-play" title="Lecture / Pause"><svg id="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg id="ico-pause" viewBox="0 0 24 24" hidden><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg></button>
        <button class="icon" id="c-next" title="Suivant"><svg viewBox="0 0 24 24"><path d="m6 18 8.500-6L6 6zM16 6v12h2V6z"/></svg></button>
      </div>
      <div class="seek"><span id="t-cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" /><span id="t-dur">0:00</span></div>
    </div>
    <div class="p-right"><svg viewBox="0 0 24 24" class="vol-ico"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.500 4.500 0 0 0 14 8v8a4.500 4.500 0 0 0 2.500-4z"/></svg><input id="vol" type="range" min="0" max="100" value="100" /></div>
  </footer>

  <div id="full" hidden>
    <div id="f-bg"></div>
    <button id="f-close" class="icon" title="Fermer"><svg viewBox="0 0 24 24"><path d="M7.400 8.600 12 13.200l4.600-4.600L18 10l-6 6-6-6z"/></svg></button>
    <div class="f-body">
      <img id="f-img" alt="" />
      <div id="f-title"></div>
      <div id="f-artist"></div>
      <div class="seek f-seek"><span id="f-cur">0:00</span><input id="f-seekbar" type="range" min="0" max="1000" value="0" /><span id="f-dur">0:00</span></div>
      <div class="controls">
        <button class="icon" id="f-prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.500 6V6z"/></svg></button>
        <button class="icon huge" id="f-play"><svg id="f-ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg id="f-ico-pause" viewBox="0 0 24 24" hidden><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg></button>
        <button class="icon" id="f-next"><svg viewBox="0 0 24 24"><path d="m6 18 8.500-6L6 6zM16 6v12h2V6z"/></svg></button>
      </div>
    </div>
  </div>
</div>
<script src="neo.js"></script>
</body>
</html>
